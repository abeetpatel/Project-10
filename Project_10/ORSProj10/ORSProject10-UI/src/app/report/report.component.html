<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 8%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card" >
        <div class="card-body shadow-lg grad">
          <form name="assetForm">
            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Add Report' | translate }}
            </h2>
            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Update Report' | translate }}
            </h2>

            <!-- Form error messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>
            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Name Field with Validation -->

            <div class="form-group pt-2">
              <label>
                <b>{{ 'Report Name' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-file grey-text"></i></div>
                </div>

                <input type="text" name="reportName" [(ngModel)]="form.data.reportName" class="form-control"
                  #clientName="ngModel" maxlength="20" pattern="^[A-Za-z ]+$"
                  (keydown)="filterInputS($event, 'errorMessageReportName', 20, 'char')"
                  placeholder="{{ 'Enter report name' | translate }}">
              </div>

              <!-- Custom error messages from component -->
              <span *ngIf="form.inputerror.reportName" class="alertRedColor">{{ form.inputerror.reportName }}</span>
            </div>

            <div class="form-group pt-2">
              <label>
                <b>{{ 'Generated By' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-user grey-text"></i></div>
                </div>

                <select class="form-control" name="generatedBy"  [(ngModel)]="form.data.generatedBy"
                  style="cursor: pointer;">
                  <option [ngValue]="" value="undefined">{{'Please select' | translate }}</option>
                  <option value="Administaration">{{'Administaration' | translate }} </option>
                  <option value="Staff">{{'Staff' | translate }} </option>
                </select>
              </div>

              <!-- Custom error messages from component -->
              <span *ngIf="form.inputerror.generatedBy" class="alertRedColor">{{ form.inputerror.generatedBy }}</span>
            </div>

            


             <div class="form-group pt-2">
              <label>
                <b>{{ 'Generated Date' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-table grey-text"></i>
                  </div>
                </div>

                <input type="date" name="generatedDate" [(ngModel)]="form.data.generatedDate"
                  class="form-control"  maxlength="50"
                  placeholder="{{ 'Enter Generated Date' | translate }}">
              </div>

              <!-- Custom validation messages from component -->
              <span *ngIf="form.inputerror.generatedDate" class="alertRedColor">{{ form.inputerror.generatedDate
                }}</span>
            </div>


              <div class="form-group pt-2">
              <label>
                <b>{{ 'Report Status' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-bell grey-text"></i></div>
                </div>

                <select class="form-control" name="reportStatus"  [(ngModel)]="form.data.reportStatus"
                  style="cursor: pointer;">
                  <option [ngValue]="" value="undefined">{{'Please select' | translate }}</option>
                  <option value="PENDING">{{'PENDING' | translate }} </option>
                  <option value="PROCESSING">{{'PROCESSING' | translate }} </option>
                  <option value="GENERATED">{{'GENERATED' | translate }} </option>
                  <option value="FAILED">{{'FAILED' | translate }} </option>
                </select>
              </div>

              <!-- Custom error messages from component -->
              <span *ngIf="form.inputerror.reportStatus" class="alertRedColor">{{ form.inputerror.reportStatus }}</span>
            </div>


            <div class="row pt-2 pl-2 pb-3">

              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Save' | translate }}
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Update' | translate }}
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1" type="button" [routerLink]="['/reportlist']"
                  style="text-decoration: none; color: white;">
                  {{ 'List' | translate }}
                </a>
              </div>

            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
